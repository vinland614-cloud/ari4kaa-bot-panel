<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Twitch Giveaway Bot</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <div class="controls">
    <h2>Розыгрыш</h2>

    <input id="keyword" placeholder="Кодовое слово">

    <label>
      Антиспам
      <input type="checkbox" id="antiSpam">
    </label>

    <label>
      Разрешить повторную победу
      <input type="checkbox" id="allowRepeat">
    </label>

    <button id="startBtn" onclick="start()">Старт</button>
    <button id="stopBtn" onclick="stop()">Стоп</button>
    <button onclick="winner()">Выбрать победителя</button>
  </div>

  <div class="participants">
    <h2>Участники <button onclick="clearList()">🗑</button></h2>
    <ul id="participantsList"></ul>
  </div>

</div>

<div id="winnerModal" class="modal">
  <div class="modalContent">
    <h2 id="winnerName"></h2>
    <div>Сообщения</div>
    <div id="winnerMessages"></div>
    <div>Таймер: <span id="timer">0</span></div>
    <button onclick="reroll()">Рерол</button>
    <button onclick="closeModal()">Закрыть</button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="script.js"></script>
</body>
</html>
