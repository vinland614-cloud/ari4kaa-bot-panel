<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Twitch Giveaway Bot</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <div class="participants">
    <h2>👥 Участники <button class="clearBtn" onclick="clearList()">🗑</button></h2>
    <ul id="participantsList"></ul>
  </div>

  <div class="center">
    <h2 class="centerTitle">🎁 Розыгрыш</h2>

    <div class="row">
      Кодовое слово:
      <input id="keyword">
    </div>

    <div class="row">
      <label>
        Антиспам
        <input type="checkbox" id="antiSpam">
      </label>

      <label>
        Повторная победа
        <input type="checkbox" id="allowRepeat">
      </label>
    </div>

    <div class="row buttons">
      <button onclick="start()" id="startBtn">Старт</button>
      <button onclick="stop()" id="stopBtn">Стоп</button>
    </div>

    <div class="row winnerRow">
      <button onclick="winner()">Выбрать победителя</button>
    </div>

  </div>

  <div class="chat">
    <h2 class="chatTitle">💬 Чат</h2>
    <div id="chatBox"></div>
  </div>

</div>

<div id="winnerModal" class="modal">
  <div class="modal-content">
    <h2 class="winnerTitle">🏆 Победитель</h2>
    <div id="winnerName"></div>

    <div class="messagesHeader">
      Сообщения
      <span id="timer">0</span>
    </div>

    <div id="winnerMessages" class="messages"></div>

    <h3>История побед</h3>
    <div id="history" class="history"></div>

    <button onclick="reroll()">Рерол</button>
    <button onclick="closeModal()">Закрыть</button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="script.js"></script>
</body>
</html>
