<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>ARi4kaa Bot Panel</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

<div class="column">
<h2>👥 Участники</h2>
<button onclick="clearUsers()">🗑</button>
<ul id="participants"></ul>
</div>

<div class="column center">
<h2>🎁 Розыгрыш</h2>

<label>Кодовое слово</label>
<input id="keyword" value="!">

<label>Макс сообщений</label>
<input id="maxSpam" value="3">

<label>Антиспам</label>
<input type="checkbox" id="antiSpam" checked>

<button onclick="start()">Старт</button>
<button onclick="stop()">Стоп</button>
<button onclick="winner()">Выбрать победителя</button>

</div>

<div class="column">
<h2>💬 Чат</h2>
<div id="chat"></div>
</div>

</div>

<div id="winnerModal" class="modal">
<div class="modal-content">
<h2 id="winnerName"></h2>
<div>Таймер: <span id="timer">60</span></div>
<div>Сообщение: <span id="winnerMsg"></span></div>
<h3>История побед</h3>
<ul id="winnerHistory"></ul>
<button onclick="reroll()">Рерол</button>
<button onclick="closeModal()">Закрыть</button>
</div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="script.js"></script>
</body>
</html>
