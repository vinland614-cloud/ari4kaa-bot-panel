<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Twitch Giveaway Bot</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="main">

  <!-- ЧАТ -->
  <div class="panel">
    <div class="panelTitle center">Чат</div>
    <div id="chat" class="chatBox"></div>
  </div>

  <!-- РОЗЫГРЫШ -->
  <div class="panel">
    <div class="panelTitle">Розыгрыш</div>

    <div class="row">
      <span>Кодовое слово</span>
      <input id="keyword">
    </div>

    <div class="row">
      <label><input type="checkbox" id="antiSpam"> Антиспам (макс 3)</label>
    </div>

    <div class="row">
      <label><input type="checkbox" id="allowRepeat"> Повторная победа</label>
    </div>

    <div class="buttons">
      <button id="startBtn" onclick="start()">Старт</button>
      <button id="stopBtn" onclick="stop()">Стоп</button>
    </div>

    <div class="center">
      <button onclick="winner()">Выбрать победителя</button>
    </div>
  </div>

  <!-- УЧАСТНИКИ -->
  <div class="panel">
    <div class="panelTitle">
      Участники
      <button class="clearBtn" onclick="clearList()">🧹</button>
    </div>
    <ul id="participantsList"></ul>
  </div>

</div>

<!-- ОКНО ПОБЕДИТЕЛЯ -->
<div id="winnerModal" class="modal">
  <div class="modalContent">

    <div class="winnerHeader">🏆 Победитель</div>
    <div id="winnerName" class="winnerName"></div>

    <div class="messagesHeader">
      Сообщения
      <span id="timer">0</span>
    </div>

    <div id="winnerMessages" class="messages"></div>

    <div class="historyTitle">История побед</div>
    <div id="winnerHistory" class="history"></div>

    <div class="modalButtons">
      <button onclick="reroll()">Рерол</button>
      <button onclick="closeModal()">Закрыть</button>
    </div>

  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="script.js"></script>
</body>
</html>
