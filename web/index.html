<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Giveaway Bot</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

<div class="column">
<div class="header">
<h2>Участники</h2>
<button class="clearBtn" onclick="clearUsers()">🧹</button>
</div>
<ul id="participants"></ul>
</div>

<div class="column center">

<div class="row">
<label>Кодовое слово</label>
<input id="keyword" value="!">
</div>

<div class="row">
<label>Макс сообщений</label>
<input id="maxSpam" value="3">

<label class="checkbox">
Антиспам <input type="checkbox" id="antiSpam">
</label>
</div>

<div class="row">
<label class="checkbox">
Повторная победа <input type="checkbox" id="allowRepeat">
</label>
</div>

<div class="row center">
<button onclick="start()">Старт</button>
<button onclick="stop()">Стоп</button>
</div>

<div class="row center">
<button onclick="winner()">Выбрать победителя</button>
</div>

</div>

<div class="column">
<h2>Чат</h2>
<div id="chat"></div>
</div>

</div>

<div id="winnerModal" class="modal">
<div class="modal-content">

<h2 class="winnerTitle">🏆 Победитель</h2>
<h3 id="winnerName"></h3>

<div class="messagesHeader">
<span>Сообщения</span>
<span id="timer">00:00</span>
</div>

<div id="winnerMessages" class="messages"></div>

<div class="historyHeader">История побед</div>
<div id="winnerHistory" class="history"></div>

<div class="modalButtons">
<button onclick="reroll()">Рерол</button>
<button onclick="closeModal()">Закрыть</button>
</div>

</div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="script.js"></script>
</body>
</html>
